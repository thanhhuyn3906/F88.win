<!DOCTYPE html><html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Casino Style Game – Virtual Coins (Demo)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #020617;
      padding: 24px;
      border-radius: 16px;
      width: 340px;
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
      text-align: center;
    }
    h1 { margin-top: 0; }
    .reels {
      display: flex;
      justify-content: space-between;
      font-size: 48px;
      margin: 20px 0;
    }
    .reel {
      width: 80px;
      background: #020617;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 10px 0;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #22c55e;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:disabled { background: #475569; cursor: not-allowed; }
    .info { margin-top: 12px; }
    .small { font-size: 12px; color: #94a3b8; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Slot Demo 🎰</h1>
    <div class="reels">
      <div class="reel" id="r1">🍒</div>
      <div class="reel" id="r2">🍋</div>
      <div class="reel" id="r3">🔔</div>
    </div>
    <button id="spinBtn">Quay (–10 coin)</button>
    <div class="info">
      <div>Số dư: <strong><span id="balance">100</span> coin</strong></div>
      <div id="result"></div>
    </div>
    <div class="small">Chỉ là game mô phỏng dùng tiền ảo – không cá cược, không tiền thật.</div>
  </div>  <script>
    const symbols = ["🍒", "🍋", "🔔", "⭐", "7️⃣"];
    let balance = 100;

    const r1 = document.getElementById('r1');
    const r2 = document.getElementById('r2');
    const r3 = document.getElementById('r3');
    const balanceEl = document.getElementById('balance');
    const resultEl = document.getElementById('result');
    const spinBtn = document.getElementById('spinBtn');

    function randomSymbol() {
      return symbols[Math.floor(Math.random() * symbols.length)];
    }

    spinBtn.onclick = () => {
      if (balance < 10) {
        resultEl.textContent = 'Hết coin! Tải lại trang để chơi lại.';
        spinBtn.disabled = true;
        return;
      }

      balance -= 10;
      r1.textContent = randomSymbol();
      r2.textContent = randomSymbol();
      r3.textContent = randomSymbol();

      if (r1.textContent === r2.textContent && r2.textContent === r3.textContent) {
        balance += 50;
        resultEl.textContent = '🎉 Trúng lớn! +50 coin';
      } else if (r1.textContent === r2.textContent || r2.textContent === r3.textContent) {
        balance += 20;
        resultEl.textContent = '👍 Trúng nhỏ! +20 coin';
      } else {
        resultEl.textContent = '😅 Không trúng';
      }

      balanceEl.textContent = balance;
    };
  </script></body>
</html>
