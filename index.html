<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Casino - Slot VIP</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --bg-color: #050505;
            --panel-color: #1a1a1a;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: white;
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink);
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }

        /* Khung chứa game */
        .game-machine {
            background: var(--panel-color);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        /* Màn hình hiển thị tiền */
        .display-board {
            background: black;
            border: 1px solid #333;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.1rem;
            color: #ffd700;
        }

        /* Khu vực quay số */
        .slots {
            display: flex;
            gap: 10px;
            justify-content: center;
            background: #000;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #444;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .reel {
            width: 80px;
            height: 100px;
            background: white;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: #333;
            box-shadow: inset 0 0 10px black;
            transition: transform 0.1s;
        }

        /* Hiệu ứng rung khi quay */
        .spinning {
            animation: blurText 0.1s infinite;
            color: transparent; 
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        @keyframes blurText {
            0% { transform: translateY(-2px); filter: blur(2px); }
            50% { transform: translateY(2px); filter: blur(4px); }
            100% { transform: translateY(-2px); filter: blur(2px); }
        }

        /* Khu vực điều khiển */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bet-control {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #333;
            color: white;
            border: 1px solid var(--neon-blue);
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .spin-btn {
            background: linear-gradient(45deg, #ff0055, #ff00ff);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 2px;
            box-shadow: 0 0 15px var(--neon-pink);
            transition: transform 0.1s, box-shadow 0.3s;
        }

        .spin-btn:active {
            transform: scale(0.95);
        }

        .spin-btn:disabled {
            background: #555;
            box-shadow: none;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            height: 20px;
            font-weight: bold;
            color: var(--neon-blue);
        }

        /* Lịch sử */
        .history {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #888;
            max-height: 100px;
            overflow-y: auto;
            text-align: left;
            border-top: 1px solid #333;
            padding-top: 10px;
        }
        .win-log { color: #00ff00; }
        .lose-log { color: #ff4444; }

    </style>
</head>
<body>

    <h1>NEON SLOTS</h1>

    <div class="game-machine">
        <div class="display-board">
            <span>VÍ: $<span id="balance">1000</span></span>
            <span>CƯỢC: $<span id="currentBet">100</span></span>
        </div>

        <div class="slots">
            <div class="reel" id="r1">💎</div>
            <div class="reel" id="r2">7️⃣</div>
            <div class="reel" id="r3">🔔</div>
        </div>

        <div id="status">Sẵn sàng quay!</div>

        <div class="controls">
            <div class="bet-control">
                <button class="btn-circle" onclick="adjustBet(-50)">-</button>
                <span>Chỉnh Cược</span>
                <button class="btn-circle" onclick="adjustBet(50)">+</button>
            </div>
            <button class="spin-btn" id="btnSpin" onclick="playGame()">QUAY NGAY</button>
        </div>

        <div class="history" id="historyLog">
            <div>-- Lịch sử ván chơi --</div>
        </div>
    </div>

    <script>
        let balance = 1000;
        let bet = 100;
        let isSpinning = false;

        // Định nghĩa biểu tượng và giá trị thưởng (Multiplier)
        // 777: x10, Kim cương: x5, Chuông: x3, Còn lại: x2
        const symbols = ["🍒", "🍋", "🍇", "🔔", "💎", "7️⃣"];
        
        const r1 = document.getElementById("r1");
        const r2 = document.getElementById("r2");
        const r3 = document.getElementById("r3");
        const balanceEl = document.getElementById("balance");
        const betEl = document.getElementById("currentBet");
        const statusEl = document.getElementById("status");
        const historyEl = document.getElementById("historyLog");
        const btnSpin = document.getElementById("btnSpin");

        function adjustBet(amount) {
            if (isSpinning) return;
            if (bet + amount >= 50 && bet + amount <= balance) {
                bet += amount;
                betEl.innerText = bet;
            }
        }

        function updateBalance() {
            balanceEl.innerText = balance;
            // Tự động điều chỉnh cược nếu số dư thấp hơn mức cược hiện tại
            if (balance < bet && balance > 0) {
                bet = balance;
                betEl.innerText = bet;
            }
        }

        function logHistory(msg, type) {
            const p = document.createElement("div");
            p.innerText = msg;
            p.className = type === "win" ? "win-log" : "lose-log";
            historyEl.prepend(p);
        }

        function getSymbol() {
            // Tăng tỷ lệ ra quả cherry/chanh, giảm tỷ lệ ra số 7
            const weighted = [
                "🍒","🍒","🍒","🍒",
                "🍋","🍋","🍋",
                "🍇","🍇",
                "🔔","🔔",
                "💎",
                "7️⃣"
            ];
            return weighted[Math.floor(Math.random() * weighted.length)];
        }

        function playGame() {
            if (balance < bet) {
                statusEl.innerText = "Hết tiền rồi đại gia ơi! (F5 nạp lại)";
                statusEl.style.color = "red";
                return;
            }

            isSpinning = true;
            btnSpin.disabled = true;
            balance -= bet;
            updateBalance();
            statusEl.innerText = "Đang quay...";
            
            // Hiệu ứng CSS
            r1.classList.add("spinning");
            r2.classList.add("spinning");
            r3.classList.add("spinning");

            // Hiệu ứng chạy số giả lập
            let interval = setInterval(() => {
                r1.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                r2.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                r3.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            }, 100);

            // Dừng quay sau 1.5 giây
            setTimeout(() => {
                clearInterval(interval);
                r1.classList.remove("spinning");
                r2.classList.remove("spinning");
                r3.classList.remove("spinning");
                
                showResult();
                isSpinning = false;
                btnSpin.disabled = false;
            }, 1500);
        }

        function showResult() {
            const s1 = getSymbol();
            const s2 = getSymbol();
            const s3 = getSymbol();

            r1.innerText = s1;
            r2.innerText = s2;
            r3.innerText = s3;

            let winAmount = 0;

            if (s1 === s2 && s2 === s3) {
                // Thắng lớn (3 giống nhau)
                if (s1 === "7️⃣") winAmount = bet * 20; // Jackpot
                else if (s1 === "💎") winAmount = bet * 10;
                else winAmount = bet * 5;
                
                statusEl.innerText = `NỔ HŨ! Thắng $${winAmount}`;
                statusEl.style.color = "#ff00ff";
                logHistory(`🏆 Nổ hũ [${s1}${s2}${s3}] +$${winAmount}`, "win");
            } 
            else if (s1 === s2 || s2 === s3 || s1 === s3) {
                // Thắng nhỏ (2 giống nhau)
                winAmount = Math.floor(bet * 1.5);
                statusEl.innerText = `Thắng nhẹ! Nhận $${winAmount}`;
                statusEl.style.color = "#00f3ff";
                logHistory(`✅ Thắng đôi [${s1}${s2}${s3}] +$${winAmount}`, "win");
            } 
            else {
                statusEl.innerText = "Chúc may mắn lần sau!";
                statusEl.style.color = "white";
                logHistory(`❌ Thua [${s1}${s2}${s3}] -$${bet}`, "lose");
            }

            balance += winAmount;
            updateBalance();
            
            if (balance <= 0) {
                setTimeout(() => alert("Bạn đã phá sản! Tải lại trang để xin cấp vốn mới."), 500);
            }
        }
    </script>
</body>
</html>
